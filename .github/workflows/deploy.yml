# Test every push; deploy `main` to Namecheap when the tests pass.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   NAMECHEAP_FTP_HOST       server hostname from cPanel
#   NAMECHEAP_FTP_USER       folder-limited FTP account created in cPanel
#   NAMECHEAP_FTP_PASSWORD   password for that account
#   NAMECHEAP_FTP_PORT       optional; explicit FTPS defaults to port 21
#   NAMECHEAP_FTP_TLS_HOST   optional certificate hostname for a shared cPanel
#                            FTP alias
#   NAMECHEAP_FTP_PATH       optional; defaults to / because the account is
#                            rooted at the Python app folder
#   SITE_URL             optional, e.g. https://moglifestyle.fit -- enables
#                        the post-deploy health check
# Full walkthrough: docs/NAMECHEAP.md.  Until the secrets exist, pushes still
# run the tests and the deploy job is skipped with a notice.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the test suite
        run: python tests/run_tests.py
      - name: Build the upload zip
        run: python tools/package.py
      - name: Keep the zip as a download
        uses: actions/upload-artifact@v4
        with:
          name: mog-lifestyle-upload-zip
          path: dist/*.zip
          retention-days: 30

  settings:
    name: Deploy settings
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          missing=""
          for name in FTP_HOST FTP_USER FTP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing NAMECHEAP_$name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Add these repository secrets to deploy automatically:$missing (see docs/NAMECHEAP.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Namecheap
    needs: [test, settings]
    if: needs.settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMECHEAP_FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
      NAMECHEAP_FTP_PORT: ${{ secrets.NAMECHEAP_FTP_PORT }}
      NAMECHEAP_FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
      NAMECHEAP_FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
      NAMECHEAP_FTP_PATH: ${{ secrets.NAMECHEAP_FTP_PATH }}
      NAMECHEAP_FTP_TLS_HOST: ${{ secrets.NAMECHEAP_FTP_TLS_HOST }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage the release
        run: python tools/package.py --stage dist/site

      - name: Upload over encrypted FTPS and restart
        run: python tools/deploy_ftps.py dist/site

      - name: Health check
        if: env.SITE_URL != ''
        run: |
          want="${GITHUB_SHA::12}"
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl -fsS --max-time 20 "${SITE_URL%/}/healthz" || true)"
            if printf '%s' "$body" | grep -q "\"build\": \"$want\""; then
              echo "Live: $SITE_URL is running $want"
              exit 0
            fi
            sleep 8
          done
          echo "::error::$SITE_URL/healthz did not report build $want. Last response: $body"
          exit 1
