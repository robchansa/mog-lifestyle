# Test every push; deploy `main` to Namecheap when the tests pass.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   NAMECHEAP_SSH_HOST       server hostname from cPanel
#   NAMECHEAP_SSH_USER       SSH username
#   NAMECHEAP_SSH_KEY        private ed25519 deploy key
#   NAMECHEAP_SSH_KNOWN_HOSTS verified SSH host key line
#   NAMECHEAP_APP_PATH       absolute application directory
#   NAMECHEAP_PYTHON         cPanel virtualenv Python executable
#   NAMECHEAP_SSH_PORT       optional; defaults to 22
#   SITE_URL             optional, e.g. https://moglifestyle.fit -- enables
#                        the post-deploy health check
# Full walkthrough: docs/NAMECHEAP.md.  Until the secrets exist, pushes still
# run the tests and the deploy job is skipped with a notice.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the test suite
        run: python tests/run_tests.py
      - name: Build the upload zip
        run: python tools/package.py
      - name: Keep the zip as a download
        uses: actions/upload-artifact@v4
        with:
          name: mog-lifestyle-upload-zip
          path: dist/*.zip
          retention-days: 30

  settings:
    name: Deploy settings
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ secrets.NAMECHEAP_APP_PATH }}
          PYTHON: ${{ secrets.NAMECHEAP_PYTHON }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_PATH PYTHON; do
            [ -n "${!name}" ] || missing="$missing NAMECHEAP_$name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Add these repository secrets to deploy automatically:$missing (see docs/NAMECHEAP.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Namecheap
    needs: [test, settings]
    if: needs.settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
      NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
      NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
      NAMECHEAP_APP_PATH: ${{ secrets.NAMECHEAP_APP_PATH }}
      NAMECHEAP_PYTHON: ${{ secrets.NAMECHEAP_PYTHON }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage the release
        run: python tools/package.py --stage dist/site

      - name: Upload over SSH and restart
        env:
          NAMECHEAP_SSH_KEY_FILE: ${{ runner.temp }}/namecheap_deploy_key
          DEPLOY_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          trap 'rm -f "$NAMECHEAP_SSH_KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$NAMECHEAP_SSH_KEY_FILE"
          chmod 600 "$NAMECHEAP_SSH_KEY_FILE"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          python tools/deploy_ssh.py dist/site

      - name: Health check
        if: env.SITE_URL != ''
        run: |
          want="${GITHUB_SHA::12}"
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl -fsS --max-time 20 "${SITE_URL%/}/healthz" || true)"
            if printf '%s' "$body" | grep -q "\"build\": \"$want\""; then
              echo "Live: $SITE_URL is running $want"
              exit 0
            fi
            sleep 8
          done
          echo "::error::$SITE_URL/healthz did not report build $want. Last response: $body"
          exit 1
